# Serves the built frontend and forwards /api to the Go API, which is the same
# split CloudFront performs in AWS: S3 origin for everything, ALB origin for
# /api/*. Keeping the local shape identical means same-origin behaviour, CORS,
# and SPA routing are all exercised the same way here as in production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NOTE: nginx does not merge add_header across levels. A location block
    # that declares any add_header of its own discards every add_header
    # inherited from the server block. That means these are NOT inherited by
    # the locations below that set their own caching headers, and have to be
    # repeated there. Setting them once here and assuming coverage silently
    # leaves the HTML document -- the one response where framing and sniffing
    # protections actually matter -- without them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Forwarded before the SPA fallback, or /api/* would be answered with
    # index.html instead of reaching the API.
    #
    # proxy_pass has no trailing path, so the original URI is passed through
    # unchanged: /api/accounts arrives at the API as /api/accounts.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Insight generation makes a synchronous model call that can legitimately
        # take tens of seconds; the 60s default would cut it off.
        proxy_read_timeout 120s;
    }

    # Static assets carry a content hash in their filename, so a changed file is
    # a changed URL and this can be cached indefinitely.
    location /static/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # index.html must never be cached: it is what points at the current hashed
    # bundles, so a stale copy pins the browser to a deleted build.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA fallback. Any path the server does not recognise is handed to the app,
    # which resolves it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
